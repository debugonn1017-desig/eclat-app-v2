# v0.3.53-B/C + v0.3.54-B: 品質ゲート CI
# 必須チェック: typecheck / 業務ルール仕様固定テスト / 対象モジュール lint / Hook重要ファイル lint
# 含めないもの: 全体 lint (既存110件のため段階解消中) /
#   build (Supabase 環境変数が必須でダミー秘密情報はコミットしない方針のため。Vercel が担う)

name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Business rule spec tests
        run: npm run test

      - name: Lint (customerCategory module)
        run: npm run lint:category

      - name: Lint (follow-up feature)
        run: npm run lint:follow-ups

      - name: Lint (daily workflow)
        run: npm run lint:daily-workflow

      - name: Lint (performance and user-scoped cache)
        run: npm run lint:performance

      - name: Lint (rank rules)
        run: npm run lint:rank-rules

      - name: Lint (customer card actions)
        run: npm run lint:customer-actions

      - name: Lint (customer visit patterns)
        run: npm run lint:visit-patterns

      - name: Lint (hooks critical files)
        run: npm run lint:hooks-critical

      - name: Lint (new cast 90-day training)
        run: npm run lint:new-cast-training
