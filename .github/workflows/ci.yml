# v0.3.53-B/C + v0.3.54-B: 品質ゲート CI
# 必須チェック: typecheck / 業務ルール仕様固定テスト / 対象モジュール lint / Hook重要ファイル lint
# 含めないもの: 全体 lint (既存110件のため段階解消中) /
#   build (Supabase 環境変数が必須でダミー秘密情報はコミットしない方針のため。Vercel が担う)

name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Business rule spec and cast tier regression tests
        run: npm run test

      - name: Cast tenure calendar boundary tests and lint
        run: npm run test:cast-tenure && npm run lint:cast-tenure

      - name: Lint (cast home and customer marks)
        run: npm run lint:cast-home-stars

      - name: Staff stars all-cast scope and regression tests
        run: npm run test:staff-stars && npm run lint:staff-stars

      - name: Initial banai follow-up date without changing financial actuals
        run: npm run test:initial-followup && npm run lint:initial-followup

      - name: Star activity log, archive, authorization and isolated PostgreSQL tests
        run: npm run test:star-logs && npm run lint:star-logs

      - name: Monthly starred customer goals, actuals and database authorization
        run: npm run test:customer-goals && npm run lint:customer-goals

      - name: Customer meeting records, financial isolation and database authorization
        run: npm run test:customer-meetings && npm run lint:customer-meetings

      - name: Explicit visit nomination corrections, audit and transaction authorization
        run: npm run test:visit-nominations && npm run lint:visit-nominations

      - name: Announcement bell and consent-based push notification tests
        run: npm run test:notifications && npm run lint:notifications

      - name: Shared cast management order and authorization tests
        run: npm run test:cast-management-order && npm run lint:cast-management-order

      - name: Shift time memo and status-only memo preservation tests
        run: npm run test:shift-time-memo && npm run lint:shift-time-memo

      - name: Locker ranking, business day, authorization and pagination tests
        run: npm run test:locker-ranking && npm run lint:locker-ranking

      - name: Customer list continuity and cast workspace lint
        run: npm run test:customer-list-continuity && npm run lint:cast-workspace

      - name: Lint (font regression preview and browser checks)
        run: npm run lint:font-pages

      - name: Lint (customerCategory module)
        run: npm run lint:category

      - name: Lint (follow-up feature)
        run: npm run lint:follow-ups

      - name: Lint (daily workflow)
        run: npm run lint:daily-workflow

      - name: Lint (performance and user-scoped cache)
        run: npm run lint:performance

      - name: Lint (rank rules)
        run: npm run lint:rank-rules

      - name: Lint (customer card actions)
        run: npm run lint:customer-actions

      - name: Manual customer rank changes, guarded writes and Undo
        run: npm run test:customer-rank-change && npm run lint:customer-rank-change

      - name: Cut customer automatic unstar, history retention and database guard
        run: npm run test:cut-star && npm run lint:cut-star

      - name: Rank origin, actual visits, safe recovery and isolated PostgreSQL tests
        run: npm run test:rank-recovery && npm run lint:rank-recovery

      - name: Lint (compact mobile customer cards and gestures)
        run: npm run lint:customer-card

      - name: Lint (customer visit patterns)
        run: npm run lint:visit-patterns

      - name: Lint (hooks critical files)
        run: npm run lint:hooks-critical

      - name: Lint (new cast 90-day training)
        run: npm run lint:new-cast-training

      - name: Lint (cast meeting log)
        run: npm run lint:cast-meeting-log

      - name: Lint (customer staff assignments)
        run: npm run lint:customer-staff

      - name: Lint (cast issue visibility sheet)
        run: npm run lint:cast-issues
